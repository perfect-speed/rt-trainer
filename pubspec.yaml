name: rt_trainer
description: Constraint-based radiotelephony trainer for Swedish PPL training.
publish_to: 'none'
version: 0.10.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  record: ^6.2.1
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenarios/
