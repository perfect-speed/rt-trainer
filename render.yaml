services:
  - type: web
    name: rt-trainer-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: ALLOWED_ORIGIN
        value: https://perfect-speed.github.io,http://localhost:5000
