services:
  - type: web
    name: rt-trainer-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-transcribe
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: cedar
      - key: OPENAI_TTS_SPEED
        value: '1.06'
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-1.5
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_REALTIME_SEGMENT_GAP_MS
        value: '65'
      - key: ALLOWED_ORIGIN
        value: https://perfect-speed.github.io,http://localhost:5000
